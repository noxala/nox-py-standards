name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

      registry-only:
        description: Backfill private registry while retaining existing GitHub assets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    # Reusable workflows are exempt from the action SHA policy.
    # The cloud policy requires this publisher from protected master.
    permissions:
      contents: write
      id-token: write
    uses: noxala/nox-python-standards/.github/workflows/publish-python.yml@master
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      attach-github-assets: ${{ github.event_name != 'workflow_dispatch' || !inputs.registry-only }}
