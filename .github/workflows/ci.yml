name: CI

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14.10
      - name: Install package and locked dependencies
        run: uv sync --locked
      - name: Check Python standards configuration
        run: uv run --locked nox-py-standards check
      - name: Check formatting and lint
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      - name: Check types
        env:
          PYRIGHT_PYTHON_USE_BUNDLED_PYRIGHT: "1"
          PYRIGHT_PYTHON_GLOBAL_NODE: "1"
        run: uv run --locked pyright --threads 4
      - name: Run tests
        run: uv run --locked pytest
      - name: Verify wheel and sdist isolation
        run: uv run --locked python tools/verify_distribution.py
