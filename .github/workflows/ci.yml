name: CI

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout-ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14.10
      - name: Install package and locked dependencies
        run: uv sync --locked
      - name: Check Python standards configuration
        run: uv run --locked nox-py-standards check
      - name: Check repository documentation
        run: uv run --locked nox-docs-check
      - name: Check formatting and lint
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      - name: Check types
        env:
          PYRIGHT_PYTHON_USE_BUNDLED_PYRIGHT: "1"
          PYRIGHT_PYTHON_GLOBAL_NODE: "1"
        run: uv run --locked pyright --threads 4
      - name: Run tests
        run: uv run --locked pytest
      - name: Verify wheel and sdist isolation
        run: uv run --locked python tools/verify_distribution.py

  cleanup-tests:
    # Exercise the queue mode used by mutation jobs in actual GitHub CI.
    concurrency:
      group: cleanup-contract-tests-${{ inputs.checkout-ref || github.ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Test private package cleanup without cloud credentials
        run: uv run --no-project --python 3.14.10 --with packaging==26.3 --with pytest==9.0.3 python -m pytest -q .github/scripts

  ci-gate:
    if: always()
    needs: [quality, cleanup-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CLEANUP_RESULT: ${{ needs.cleanup-tests.result }}
        run: test "$QUALITY_RESULT" = success && test "$CLEANUP_RESULT" = success
